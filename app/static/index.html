<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星载姿控参数 · 崩溃恢复审计台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: "SF Mono", "Cascadia Code", Consolas, "Noto Sans SC", monospace;
         margin: 0; background: #0e1420; color: #d7e1ee; }
  header { padding: 14px 22px; background: #16203a; border-bottom: 1px solid #2a3b5e; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: 1px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #8fa3c8; }
  main { padding: 18px 22px 60px; max-width: 1280px; margin: 0 auto; }
  fieldset { border: 1px solid #2a3b5e; border-radius: 8px; margin: 0 0 16px; padding: 12px 14px; }
  legend { padding: 0 8px; font-size: 13px; color: #9db4dd; }
  label { display: block; font-size: 12px; color: #8fa3c8; margin: 8px 0 4px; }
  input[type=text], textarea { width: 100%; background: #0a101c; color: #d7e1ee;
    border: 1px solid #2a3b5e; border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 12px; }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
           padding: 8px 16px; font: inherit; font-size: 13px; cursor: pointer; }
  button.secondary { background: #2a3b5e; }
  button:hover { filter: brightness(1.15); }
  #banner { display: none; padding: 10px 14px; border-radius: 8px; margin: 14px 0; font-size: 13px; }
  #banner.ok { display: block; background: #12351f; border: 1px solid #2ea043; color: #7ee2a0; }
  #banner.err { display: block; background: #3d1418; border: 1px solid #da3633; color: #ff9a94; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0 22px; font-size: 12px; }
  th, td { border: 1px solid #2a3b5e; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { background: #16203a; color: #9db4dd; position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .wrap { overflow-x: auto; }
  h2 { font-size: 14px; color: #9db4dd; margin: 22px 0 6px; }
  .muted { color: #6b7d9f; font-size: 12px; }
  code { background: #0a101c; padding: 1px 5px; border-radius: 4px; }
  .mono { word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>星载姿控参数 · 崩溃恢复审计台</h1>
  <p>ARIES 三阶段裁决:分析(自检查点)→ 重做(自最小 recLSN)→ 撤销(沿失败事务前驱链)。上限:48 个初始页像 / 128 条 WAL 记录。</p>
</header>
<main>
  <fieldset>
    <legend>审计输入</legend>
    <label for="audit_id">稳定审计标识</label>
    <input type="text" id="audit_id" maxlength="128" placeholder="例如 SAT-ATT-2026-001">
    <label for="pages">初始页像(JSON 数组,≤48;每项 {page_id, page_lsn, data:hex})</label>
    <textarea id="pages" spellcheck="false"></textarea>
    <label for="wal">受限 WAL 记录(JSON 数组,≤128,按 LSN 严格递增)</label>
    <textarea id="wal" spellcheck="false"></textarea>
    <div class="row">
      <button id="submit">提交并冻结裁决</button>
      <button class="secondary" id="sample">载入示例</button>
      <button class="secondary" id="query">读取已冻结裁决</button>
      <span class="muted">拒绝时将清除该标识旧的成功证据</span>
    </div>
  </fieldset>

  <div id="banner"></div>
  <div id="result"></div>
</main>

<script>
const SAMPLE = {
  audit_id: "SAT-ATT-2026-001",
  pages: [
    {page_id: 7, page_lsn: 110, data: "11110000000000000000000000000000"},
    {page_id: 9, page_lsn: 90,  data: "00000000000000000000000000000000"}
  ],
  wal: [
    {lsn: 100, type: "begin",  txn: "T1"},
    {lsn: 110, type: "update", txn: "T1", prev_lsn: 100, page_id: 7, offset: 0, length: 2, before: "0000", after: "1111"},
    {lsn: 120, type: "begin",  txn: "T2"},
    {lsn: 130, type: "update", txn: "T2", prev_lsn: 120, page_id: 7, offset: 4, length: 2, before: "0000", after: "2222"},
    {lsn: 140, type: "checkpoint", txns: [{txn: "T1", last_lsn: 110, status: "running"}, {txn: "T2", last_lsn: 130, status: "running"}], dpt: [{page_id: 7, rec_lsn: 110}]},
    {lsn: 150, type: "update", txn: "T1", prev_lsn: 110, page_id: 9, offset: 0, length: 2, before: "0000", after: "3333"},
    {lsn: 160, type: "commit", txn: "T1", prev_lsn: 150},
    {lsn: 170, type: "update", txn: "T2", prev_lsn: 130, page_id: 9, offset: 4, length: 2, before: "0000", after: "4444"}
  ]
};

const $ = id => document.getElementById(id);

$("sample").onclick = () => {
  $("audit_id").value = SAMPLE.audit_id;
  $("pages").value = JSON.stringify(SAMPLE.pages, null, 2);
  $("wal").value = JSON.stringify(SAMPLE.wal, null, 2);
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function clearEvidence() { $("result").innerHTML = ""; }

function showBanner(ok, html) {
  const b = $("banner");
  b.className = ok ? "ok" : "err";
  b.innerHTML = html;
}

function renderVerdict(v) {
  const a = v.analysis;
  let h = "";
  h += `<h2>分析阶段(检查点 LSN:${esc(v.checkpoint_lsn ?? "无")};重做起点 LSN:${esc(v.redo_from_lsn ?? "无")})</h2>`;
  h += `<p class="muted">获胜事务(已提交):<code>${esc(a.winners.join(", ") || "无")}</code>
        &nbsp;失败事务(需撤销):<code>${esc(a.losers.join(", ") || "无")}</code></p>`;
  h += `<div class="wrap"><table><tr><th>事务</th><th>状态</th><th>lastLSN</th></tr>`;
  for (const [t, info] of Object.entries(a.transaction_table))
    h += `<tr><td>${esc(t)}</td><td>${esc(info.status)}</td><td class="num">${esc(info.last_lsn)}</td></tr>`;
  if (!Object.keys(a.transaction_table).length) h += `<tr><td colspan="3" class="muted">空</td></tr>`;
  h += `</table></div>`;
  h += `<div class="wrap"><table><tr><th>脏页</th><th>recLSN</th></tr>`;
  for (const [p, r] of Object.entries(a.dirty_page_table))
    h += `<tr><td class="num">${esc(p)}</td><td class="num">${esc(r)}</td></tr>`;
  if (!Object.keys(a.dirty_page_table).length) h += `<tr><td colspan="2" class="muted">空</td></tr>`;
  h += `</table></div>`;

  h += `<h2>逐条记录判据(分析归属 / 重做 / 撤销)</h2><div class="wrap"><table>
        <tr><th>LSN</th><th>类型</th><th>事务</th><th>分析归属</th><th>重做判据</th><th>撤销判据</th></tr>`;
  for (const r of v.records)
    h += `<tr><td class="num">${esc(r.lsn)}</td><td>${esc(r.type)}</td><td>${esc(r.txn ?? "—")}</td>
          <td>${esc(r.analysis)}</td><td>${esc(r.redo)}</td><td>${esc(r.undo)}</td></tr>`;
  h += `</table></div>`;

  if (v.clr_records.length) {
    h += `<h2>补偿日志记录(CLR)</h2><div class="wrap"><table><tr><th>CLR LSN</th><th>事务</th><th>页号</th><th>被撤销 LSN</th></tr>`;
    for (const c of v.clr_records)
      h += `<tr><td class="num">${esc(c.lsn)}</td><td>${esc(c.txn)}</td><td class="num">${esc(c.page_id)}</td><td class="num">${esc(c.undoes_lsn)}</td></tr>`;
    h += `</table></div>`;
  }

  h += `<h2>最终页摘要(恢复前后 pageLSN 与 SHA-256)</h2><div class="wrap"><table>
        <tr><th>页号</th><th>pageLSN 前</th><th>pageLSN 后</th><th>SHA-256(恢复前)</th><th>SHA-256(最终)</th><th>变化</th></tr>`;
  for (const p of v.pages)
    h += `<tr><td class="num">${esc(p.page_id)}</td><td class="num">${esc(p.page_lsn_before)}</td>
          <td class="num">${esc(p.page_lsn_after)}</td>
          <td class="mono">${esc(p.sha256_before)}</td><td class="mono">${esc(p.sha256_after)}</td>
          <td>${p.changed ? "已改写" : "未变"}</td></tr>`;
  h += `</table></div>`;
  h += `<p class="muted">裁决指纹 verdict_sha256:<code>${esc(v.verdict_sha256)}</code></p>`;
  return h;
}

async function submit() {
  clearEvidence();
  let payload;
  try {
    payload = {
      audit_id: $("audit_id").value,
      pages: JSON.parse($("pages").value || "[]"),
      wal: JSON.parse($("wal").value || "[]")
    };
  } catch (e) {
    showBanner(false, `本地 JSON 解析失败:${esc(e.message)}`);
    return;
  }
  let resp, body;
  try {
    resp = await fetch("/api/recover", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    body = await resp.json();
  } catch (e) {
    showBanner(false, `请求失败:${esc(e.message)}`);
    return;
  }
  if (resp.ok && body.verdict === "OK") {
    showBanner(true, `裁决已冻结:OK · 审计标识 <code>${esc(body.audit_id)}</code>`);
    $("result").innerHTML = renderVerdict(body);
  } else {
    // 稳定拒绝:清除旧成功证据(页面与服务端同步清除)
    clearEvidence();
    showBanner(false, `稳定拒绝 <code>${esc(body.error || "UNKNOWN")}</code>
      ${body.lsn != null ? `@ LSN ${esc(body.lsn)}` : ""}:${esc(body.message || "")}
      <br><span class="muted">该审计标识的旧成功证据已清除。</span>`);
  }
}

async function query() {
  clearEvidence();
  const id = $("audit_id").value;
  const resp = await fetch("/api/verdict/" + encodeURIComponent(id));
  const body = await resp.json();
  if (resp.ok) {
    showBanner(true, `已读取冻结裁决:审计标识 <code>${esc(body.audit_id)}</code>`);
    $("result").innerHTML = renderVerdict(body);
  } else {
    showBanner(false, `无冻结裁决:<code>${esc(id)}</code>(${esc(body.error || resp.status)})`);
  }
}

$("submit").onclick = submit;
$("query").onclick = query;
</script>
</body>
</html>
